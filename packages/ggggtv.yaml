# ggggtv.yaml - remote help for Fire TVs: the in-laws' stick and Kevin's Cube (package).
#
# Each TV has a key used in every entity/path: ggggtv (in-laws, 192.168.5.74) and cube
# (Fire TV Cube, 192.168.4.51). The shared scripts take it as `tv`; the media_player for each
# key lives in the `tvs` map (&tvs). To add a TV: add it to &tvs, add an input_boolean,
# a now-playing sensor, a *_live_loop script, a Local File camera and a dashboard view.
#
# "Live view" grabs a screenshot from the TV over ADB in a loop and shows it on the
# GGGGTV dashboard (dashboards/ggggtv.yaml, one tab per TV):
#   screencap on the TV -> androidtv.download to /config/www/<tv>/tmp.png
#   -> shell_command converts it to a 1280-wide JPEG and renames that over screen.jpg (atomic,
#      so no half-written frames) -> camera.<tv>_screen (Local File camera on screen.jpg) streams it.
# Expect a frame every ~2.5 s (the TV's own screencap takes ~1.7 s). DRM apps (Netflix, Stan...)
# capture as black, but app menus/guides drawn over the video still show. Every 3rd frame
# also reads what's playing + the on-screen text (script.ggggtv_screen_info) into
# sensor.<tv>_now_playing - DRM can't hide those.
# Live view switches itself off after 10 minutes so it never runs forever.
#
# One-off setup per TV (not YAML): Local File integration -> name "<TV> screen", path
# /config/www/<tv>/screen.jpg (the file must exist: run script.ggggtv_screenshot for it first).
#
# Health (per TV, shown at the top of its dashboard tab):
#   binary_sensor.<tv>_ping + sensor.<tv>_ping_latency - Ping integration (UI config entry, one per
#     TV IP; entities renamed from binary_sensor.192_168_x_y). Note: Ping only creates its latency
#     sensors if the host answered when the entry loaded, and they're disabled by default.
#   sensor.<tv>_adb - does ADB actually answer? script.ggggtv_health_check runs `echo` over ADB
#     (every 2 min + on ping/player changes + the dashboard's Check now) and fires ggggtv_adb_check;
#     live-view frames count as proof too. Attributes: latency_ms (ADB round trip), last_ok, checked_at.
#   image.<tv>_screen's state = time of the last frame.
# Everything the dashboard shows comes through HA (entities, image proxy, scripts): nothing in
# the browser talks to the TVs directly, so it works away from home without the VPN.
#
# Master copy: GitHub kevinwithnall/HomeAssistant packages/ggggtv.yaml
# Deployed to: /config/packages/ggggtv.yaml

input_boolean:
  ggggtv_live:
    name: GGGGTV live view
    icon: mdi:monitor-eye
  cube_live:
    name: Fire Cube live view
    icon: mdi:monitor-eye

template:
  - triggers:
      - trigger: event
        event_type: ggggtv_screen_info
        event_data: {tv: ggggtv}
    sensor:
      - name: GGGGTV now playing
        unique_id: ggggtv_now_playing
        icon: mdi:play-box-outline
        state: "{{ trigger.event.data.now_playing[:255] }}"
        attributes:
          focused: "{{ trigger.event.data.focused }}"
          screen_text: "{{ trigger.event.data.labels }}"
          # Changes on every read, so last_updated (used for the dashboard's "Read … ago") moves
          # even when the text is identical
          read_at: "{{ now().isoformat() }}"
  - triggers:
      - trigger: event
        event_type: ggggtv_screen_info
        event_data: {tv: cube}
    sensor:
      - name: Fire Cube now playing
        unique_id: cube_now_playing
        icon: mdi:play-box-outline
        state: "{{ trigger.event.data.now_playing[:255] }}"
        attributes:
          focused: "{{ trigger.event.data.focused }}"
          screen_text: "{{ trigger.event.data.labels }}"
          # Changes on every read, so last_updated (used for the dashboard's "Read … ago") moves
          # even when the text is identical
          read_at: "{{ now().isoformat() }}"
  # Does ADB answer? Fed by script.ggggtv_health_check (ggggtv_adb_check) and by live-view
  # frames / screen reads (proof ADB works). Player going unavailable = ADB connection lost.
  - triggers:
      - trigger: event
        event_type: ggggtv_adb_check
        event_data: {tv: ggggtv}
        id: check
      - trigger: event
        event_type: ggggtv_frame
        event_data: {tv: ggggtv}
        id: frame
      - trigger: event
        event_type: ggggtv_screen_info
        event_data: {tv: ggggtv}
        id: frame
      - trigger: state
        entity_id: media_player.fire_tv_192_168_5_74
        to: unavailable
        id: lost
    variables:
      player: media_player.fire_tv_192_168_5_74
      # A frame/screen read only counts while the player is up (the scripts bail out otherwise)
      ok: >-
        {{ (trigger.id == 'frame' and states(player) not in ['unavailable', 'unknown'])
           or (trigger.id == 'check' and trigger.event.data.ok) }}
    sensor:
      - name: GGGGTV ADB
        unique_id: ggggtv_adb
        icon: mdi:android-debug-bridge
        state: "{{ 'Responding' if ok else 'Not responding' }}"
        attributes:
          latency_ms: >-
            {{ trigger.event.data.latency_ms if trigger.id == 'check' and ok
               else (this.attributes.latency_ms if ok else none) }}
          last_ok: "{{ now().isoformat() if ok else this.attributes.last_ok | default(none) }}"
          checked_at: "{{ now().isoformat() }}"
  # Does ADB answer? Fed by script.ggggtv_health_check (ggggtv_adb_check) and by live-view
  # frames / screen reads (proof ADB works). Player going unavailable = ADB connection lost.
  - triggers:
      - trigger: event
        event_type: ggggtv_adb_check
        event_data: {tv: cube}
        id: check
      - trigger: event
        event_type: ggggtv_frame
        event_data: {tv: cube}
        id: frame
      - trigger: event
        event_type: ggggtv_screen_info
        event_data: {tv: cube}
        id: frame
      - trigger: state
        entity_id: media_player.fire_tv_192_168_4_51
        to: unavailable
        id: lost
    variables:
      player: media_player.fire_tv_192_168_4_51
      # A frame/screen read only counts while the player is up (the scripts bail out otherwise)
      ok: >-
        {{ (trigger.id == 'frame' and states(player) not in ['unavailable', 'unknown'])
           or (trigger.id == 'check' and trigger.event.data.ok) }}
    sensor:
      - name: Fire Cube ADB
        unique_id: cube_adb
        icon: mdi:android-debug-bridge
        state: "{{ 'Responding' if ok else 'Not responding' }}"
        attributes:
          latency_ms: >-
            {{ trigger.event.data.latency_ms if trigger.id == 'check' and ok
               else (this.attributes.latency_ms if ok else none) }}
          last_ok: "{{ now().isoformat() if ok else this.attributes.last_ok | default(none) }}"
          checked_at: "{{ now().isoformat() }}"
  # Pushed picture: each new frame fires ggggtv_frame, the URL changes, HA re-fetches the camera
  # image and the dashboard reloads it. (The camera's MJPEG live view stalled in the browser.)
  - triggers:
      - trigger: event
        event_type: ggggtv_frame
        event_data: {tv: ggggtv}
    image:
      - name: GGGGTV screen
        unique_id: ggggtv_screen_image
        verify_ssl: false
        url: "https://127.0.0.1:8123/api/camera_proxy/camera.ggggtv_screen?token={{ state_attr('camera.ggggtv_screen', 'access_token') }}&t={{ trigger.event.time_fired.timestamp() }}"
  # Pushed picture: each new frame fires ggggtv_frame, the URL changes, HA re-fetches the camera
  # image and the dashboard reloads it. (The camera's MJPEG live view stalled in the browser.)
  - triggers:
      - trigger: event
        event_type: ggggtv_frame
        event_data: {tv: cube}
    image:
      - name: Fire Cube screen
        unique_id: cube_screen_image
        verify_ssl: false
        url: "https://127.0.0.1:8123/api/camera_proxy/camera.cube_screen?token={{ state_attr('camera.cube_screen', 'access_token') }}&t={{ trigger.event.time_fired.timestamp() }}"

# Templated shell_commands run without a shell (no &&), hence two steps. The full-size PNG
# (0.9-2.4 MB) is too heavy to stream over the VPN - a 1280x720 JPEG is ~1/10 of that. Aspect is
# kept and padded to 16:9: some apps (7plus) briefly draw a portrait 1080x1920 screen.
shell_command:
  ggggtv_convert: ffmpeg -loglevel error -y -i /config/www/{{ tv }}/tmp.png -vf scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2 -q:v 5 /config/www/{{ tv }}/tmp.jpg
  ggggtv_publish: mv -f /config/www/{{ tv }}/tmp.jpg /config/www/{{ tv }}/screen.jpg

script:
  ggggtv_screenshot:
    alias: GGGGTV screenshot
    icon: mdi:camera
    mode: parallel
    fields:
      tv: &tv_field
        name: TV
        description: Which TV (key in the tvs map)
        example: ggggtv
        required: true
        selector:
          select:
            options: [ggggtv, cube]
    variables:
      tvs: &tvs
        ggggtv: media_player.fire_tv_192_168_5_74
        cube: media_player.fire_tv_192_168_4_51
      player: "{{ tvs[tv] }}"
    sequence:
      # ADB down -> HA silently skips the androidtv actions, so stop rather than republish the old frame
      - condition: template
        value_template: "{{ tv in tvs and states(player) not in ['unavailable', 'unknown'] }}"
      - action: androidtv.adb_command
        target: {entity_id: "{{ player }}"}
        data: {command: screencap -p /sdcard/ggggtv.png}
      - action: androidtv.download
        target: {entity_id: "{{ player }}"}
        data:
          device_path: /sdcard/ggggtv.png
          local_path: "/config/www/{{ tv }}/tmp.png"
      - action: shell_command.ggggtv_convert
        data: {tv: "{{ tv }}"}
      - action: shell_command.ggggtv_publish
        data: {tv: "{{ tv }}"}
      - event: ggggtv_frame
        event_data: {tv: "{{ tv }}"}

  # What's playing (Android media sessions) and the text on screen (accessibility tree via
  # uiautomator) - both still readable when DRM blanks the picture. The UI dump is reduced on
  # the TV to one `focused|text|content-desc` line per node; parsed into sensor.<tv>_now_playing.
  # (`uiautomator dump /dev/tty` can't be piped, and toybox `grep -oE a|b` drops matches - so file + sed.)
  ggggtv_screen_info:
    alias: GGGGTV read screen
    icon: mdi:text-recognition
    mode: parallel
    fields:
      tv: *tv_field
    variables:
      tvs: *tvs
      player: "{{ tvs[tv] }}"
    sequence:
      - condition: template
        value_template: "{{ tv in tvs and states(player) not in ['unavailable', 'unknown'] }}"
      - action: androidtv.adb_command
        target: {entity_id: "{{ player }}"}
        data:
          command: >-
            dumpsys media_session | grep -E 'package=|state=PlaybackState|description=';
            echo ===UI; F=/sdcard/ggggtv_ui.xml; rm -f $F;
            uiautomator dump $F >/dev/null 2>&1; [ -s $F ] || uiautomator dump $F >/dev/null 2>&1;
            sed -e 's/<node /\n/g' $F | sed -n -e 's/.*text="\([^"]*\)".*content-desc="\([^"]*\)".* focused="\([a-z]*\)".*/\3|\1|\2/p'
      - variables:
          resp: "{{ state_attr(player, 'adb_response') or '' }}"
          apps:
            com.swm.live: 7plus
            com.netflix.ninja: Netflix
            com.disney.disneyplus: Disney+
            com.amazon.firetv.youtube: YouTube
            com.apple.atve.amazon.appletv: Apple TV
            au.com.stan.and: Stan
            au.com.streamotion.ctv.binge: BINGE
            au.net.abc.iview: ABC iview
            com.sbs.ondemand.tv: SBS
            au.com.ninenow.ctv: 9Now
            au.com.tenplay: 10 play
            com.tubitv.ott: Tubi
          # The most recently updated session that is paused (2), playing (3) or buffering (6) and
          # has a title. Apps like 7plus leave a stale "buffering" session behind for every channel
          # change, so only the newest `updated=` (device uptime ms) counts.
          now_playing: >-
            {% set ns = namespace(pkg='', st=-1, upd=0, best='', best_upd=-1) %}
            {% for l in resp.split('===UI')[0].split('\n') | map('trim') %}
              {% if l.startswith('package=') %}{% set ns.pkg = l[8:] %}{% set ns.st = -1 %}
              {% elif l.startswith('state=PlaybackState') %}
                {% set ns.st = l | regex_findall_index('state=(\d+)') | int %}
                {% set ns.upd = l | regex_findall_index('updated=(\d+)') | int(0) %}
              {% elif l.startswith('metadata:') and ns.st in [2, 3, 6] and ns.upd > ns.best_upd %}
                {% set title = (l | regex_findall_index('description=(.*)')).split(', ')[0] %}
                {% if title not in ['', 'null'] %}
                  {% set ns.best = title ~ ' (' ~ apps.get(ns.pkg, ns.pkg) ~ (', paused' if ns.st == 2 else '') ~ ')' %}
                  {% set ns.best_upd = ns.upd %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.best or 'Nothing playing' }}
          # One `focused|text|desc` line per node, parents before children; a focused container
          # without its own label takes the next label below it.
          screen: >-
            {% set u = namespace(labels=[], focused='', want=false) %}
            {% for l in (resp.split('===UI')[1] if '===UI' in resp else '').split('\n') if l.count('|') >= 2 %}
              {% set f = l.split('|', 2) %}
              {% set label = (f[1] or f[2]) | replace('&amp;', '&') | replace('&quot;', '"') | replace('&#39;', "'") | replace('&lt;', '<') | replace('&gt;', '>') | trim %}
              {% if f[0] | trim == 'true' %}
                {% if label %}{% set u.focused = label %}{% else %}{% set u.want = true %}{% endif %}
              {% elif label and u.want %}{% set u.focused = label %}{% set u.want = false %}
              {% endif %}
              {% if label and label not in u.labels %}{% set u.labels = u.labels + [label] %}{% endif %}
            {% endfor %}
            {{ {'focused': u.focused, 'labels': u.labels[:60]} | to_json }}
      - event: ggggtv_screen_info
        event_data:
          tv: "{{ tv }}"
          now_playing: "{{ now_playing }}"
          focused: "{{ (screen if screen is mapping else screen | from_json).focused }}"
          labels: "{{ (screen if screen is mapping else screen | from_json).labels }}"

  # Health check: is the TV pingable and does ADB answer? Refreshes the ping + player entities,
  # then sends `echo <token>` over ADB and times the reply. Result -> ggggtv_adb_check event ->
  # sensor.<tv>_adb. Skips the ADB echo while live view is getting frames (the frames prove ADB
  # works, and adb_response is shared with the loop's screen reads).
  ggggtv_health_check:
    alias: GGGGTV health check
    icon: mdi:heart-pulse
    mode: parallel
    fields:
      tv: *tv_field
    variables:
      tvs: *tvs
      player: "{{ tvs[tv] }}"
    sequence:
      - condition: template
        value_template: "{{ tv in tvs }}"
      - action: homeassistant.update_entity
        target: {entity_id: ["binary_sensor.{{ tv }}_ping", "{{ player }}"]}
        continue_on_error: true
      - if: >-
          {{ is_state('input_boolean.' ~ tv ~ '_live', 'on')
             and (now() - states['image.' ~ tv ~ '_screen'].last_changed).total_seconds() < 30
             if states['image.' ~ tv ~ '_screen'] is not none else false }}
        then:
          - stop: Live view is running - its frames show ADB is fine
      - variables:
          token: "hc{{ now().timestamp() | int }}"
          started: "{{ now().timestamp() }}"
          up: "{{ states(player) not in ['unavailable', 'unknown'] }}"
      - if: "{{ up }}"
        then:
          - action: androidtv.adb_command
            target: {entity_id: "{{ player }}"}
            data: {command: "echo {{ token }}"}
            continue_on_error: true
      - event: ggggtv_adb_check
        event_data:
          tv: "{{ tv }}"
          ok: "{{ up and (state_attr(player, 'adb_response') or '') | trim == token }}"
          latency_ms: "{{ ((now().timestamp() - started) * 1000) | round(0) | int }}"

  # One loop script per TV (mode single = one loop per TV); they share this sequence.
  ggggtv_live_loop:
    alias: GGGGTV live view loop
    icon: mdi:monitor-eye
    mode: single
    max_exceeded: silent
    variables:
      tv: ggggtv
      tvs: *tvs
    sequence: &live_loop
      - variables:
          stop_at: "{{ (now() + timedelta(minutes=10)).isoformat() }}"
          live: "input_boolean.{{ tv }}_live"
      - repeat:
          while:
            - condition: template
              value_template: "{{ is_state(live, 'on') and now() < stop_at | as_datetime }}"
          sequence:
            - action: script.ggggtv_screenshot
              data: {tv: "{{ tv }}"}
              continue_on_error: true
            # Screen text is slow (~3 s) so refresh it every 3rd frame
            - if: "{{ repeat.index % 3 == 1 }}"
              then:
                - action: script.ggggtv_screen_info
                  data: {tv: "{{ tv }}"}
                  continue_on_error: true
            # Back off a little if the TV is unreachable so we don't hammer ADB
            - delay: "{{ '00:00:00.2' if states(tvs[tv]) not in ['unavailable', 'unknown'] else '00:00:05' }}"
      - action: input_boolean.turn_off
        target: {entity_id: "{{ live }}"}

  cube_live_loop:
    alias: Fire Cube live view loop
    icon: mdi:monitor-eye
    mode: single
    max_exceeded: silent
    variables:
      tv: cube
      tvs: *tvs
    sequence: *live_loop

  # Remote buttons. Sent as ADB `input keyevent` - the remote.fire_tv_* entities are registry
  # leftovers that no integration serves, so remote.send_command goes nowhere. ~0.8 s per key.
  ggggtv_key:
    alias: GGGGTV remote key
    icon: mdi:remote
    mode: queued
    fields:
      tv: *tv_field
      key:
        name: Key
        example: up
        required: true
        selector:
          select:
            options: [up, down, left, right, ok, back, home, menu, power, volume_up, volume_down, mute, play_pause, rewind, fast_forward]
    variables:
      tvs: *tvs
      keycodes:
        up: 19
        down: 20
        left: 21
        right: 22
        ok: 23
        back: 4
        home: 3
        menu: 82
        power: 26
        volume_up: 24
        volume_down: 25
        mute: 164
        play_pause: 85
        rewind: 89
        fast_forward: 90
    sequence:
      - condition: template
        value_template: "{{ tv in tvs and key in keycodes }}"
      - action: androidtv.adb_command
        target: {entity_id: "{{ tvs[tv] }}"}
        data: {command: "input keyevent {{ keycodes[key] }}"}
      - action: input_boolean.turn_on
        target: {entity_id: "input_boolean.{{ tv }}_live"}

  ggggtv_launch_app:
    alias: GGGGTV launch app
    icon: mdi:application
    mode: queued
    fields:
      tv: *tv_field
      package:
        name: Package
        description: Android package name of the app to launch
        example: com.netflix.ninja
        required: true
        selector:
          text:
    variables:
      tvs: *tvs
    sequence:
      - condition: template
        value_template: "{{ tv in tvs }}"
      - action: androidtv.adb_command
        target: {entity_id: "{{ tvs[tv] }}"}
        data: {command: "monkey -p {{ package }} -c android.intent.category.LAUNCHER 1"}
      - action: input_boolean.turn_on
        target: {entity_id: "input_boolean.{{ tv }}_live"}

automation:
  - id: ggggtv_live_view
    alias: GGGGTV live view
    description: Run each TV's screenshot loop while its live view is on (see packages/ggggtv.yaml)
    mode: parallel
    triggers:
      - trigger: state
        entity_id: [input_boolean.ggggtv_live, input_boolean.cube_live]
        to: "on"
      # Loop killed (script reload, restart) while live view is still on -> start it again
      - trigger: state
        entity_id: [script.ggggtv_live_loop, script.cube_live_loop]
        to: "off"
        for: {seconds: 5}
      - trigger: homeassistant
        event: start
      # A script reload kills running loops before this automation is listening again
      - trigger: event
        event_type: automation_reloaded
    actions:
      # Every TV whose live view is on (start event) or just the one that triggered
      - repeat:
          for_each: >-
            {% set tvs = ['ggggtv', 'cube'] %}
            {% set t = trigger.entity_id.split('.')[1].split('_')[0] if trigger.entity_id is defined else '' %}
            {% set ns = namespace(on=[]) %}
            {% for tv in ([t] if t in tvs else tvs) if is_state('input_boolean.' ~ tv ~ '_live', 'on') %}
              {% set ns.on = ns.on + [tv] %}
            {% endfor %}
            {{ ns.on }}
          sequence:
            - action: script.turn_on
              target: {entity_id: "script.{{ repeat.item }}_live_loop"}

  - id: ggggtv_health_check
    alias: GGGGTV health check
    description: Check each Fire TV answers ping + ADB every 2 min and when its connection changes (packages/ggggtv.yaml)
    mode: parallel
    triggers:
      - trigger: time_pattern
        minutes: /2
      - trigger: state
        entity_id: [binary_sensor.ggggtv_ping, media_player.fire_tv_192_168_5_74]
        to: ~  # state changes only, not attribute updates
        id: ggggtv
      - trigger: state
        entity_id: [binary_sensor.cube_ping, media_player.fire_tv_192_168_4_51]
        to: ~  # state changes only, not attribute updates
        id: cube
      - trigger: homeassistant
        event: start
    conditions:
      # Only connection changes (to/from unavailable or ping flips), not every playback change
      - condition: template
        value_template: >-
          {{ trigger.platform != 'state'
             or trigger.to_state.domain == 'binary_sensor'
             or 'unavailable' in [trigger.from_state.state, trigger.to_state.state] }}
    actions:
      - repeat:
          for_each: "{{ [trigger.id] if trigger.id in ['ggggtv', 'cube'] else ['ggggtv', 'cube'] }}"
          sequence:
            - action: script.ggggtv_health_check
              data: {tv: "{{ repeat.item }}"}
              continue_on_error: true

  # Ping adds its latency sensor only if the TV answered when the entry loaded: reload the entry
  # once the TV is back so sensor.<tv>_ping_latency reappears.
  - id: ggggtv_ping_latency_restore
    alias: GGGGTV ping latency restore
    description: Reload a TV's Ping entry when it comes back online without its latency sensor (packages/ggggtv.yaml)
    mode: queued
    triggers:
      - trigger: state
        entity_id: [binary_sensor.ggggtv_ping, binary_sensor.cube_ping]
        to: "on"
        for: {seconds: 30}
    conditions:
      - condition: template
        value_template: "{{ states('sensor.' ~ trigger.entity_id.split('.')[1] ~ '_latency') in ['unavailable', 'unknown'] }}"
    actions:
      - action: homeassistant.reload_config_entry
        target: {entity_id: "{{ trigger.entity_id }}"}
