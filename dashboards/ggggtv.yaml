# "GGGGTV" dashboard (url /dashboard-ggggtv) - remote help for Fire TVs, one tab per TV.
# Each tab (dashboards/firetv_view.yaml) has the screen view (camera.<tv>_screen, fed by the
# live-view loop in packages/ggggtv.yaml), remote control and app launchers. App buttons
# start live view so you see the app open.
# Deploy with scripts/deploy_dashboard.sh dashboards/ggggtv.yaml
dashboard:
  url_path: dashboard-ggggtv
  title: GGGGTV
  icon: mdi:television-guide
  require_admin: false
  show_in_sidebar: true

config:
  views:
    # In-laws' Fire TV Stick (over the WireGuard VPN). Path stays `tv` for existing links.
    - !template
      file: firetv_view.yaml
      vars:
        tv: ggggtv
        path: tv
        title: GGGGTV
        icon: mdi:television
        player: media_player.fire_tv_192_168_5_74
    # Kevin's Fire TV Cube (3rd gen, AFTGAZL)
    - !template
      file: firetv_view.yaml
      vars:
        tv: cube
        path: cube
        title: Fire Cube
        icon: mdi:cube-outline
        player: media_player.fire_tv_192_168_4_51
