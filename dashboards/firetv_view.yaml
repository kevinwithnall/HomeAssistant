# One Fire TV's tab on the GGGGTV dashboard: screen view, remote and app launchers.
# Used via `!template {file: firetv_view.yaml, vars: {...}}` from ggggtv.yaml; the
# $$-placeholders are filled in per TV. tv is the TV's key in packages/ggggtv.yaml
# (entity/path prefix).
title: ${title}
path: ${path}
icon: ${icon}
type: sections
max_columns: 3

sections:
  # ---- Is the TV answering? (all from HA entities - nothing in the browser talks to the TV) ----
  - type: grid
    column_span: 3
    cards:
      - type: markdown
        content: |-
          {% set ping = states('binary_sensor.${tv}_ping') %}
          {% set rtt = states('sensor.${tv}_ping_latency') %}
          {% set adb = states.sensor.${tv}_adb %}
          {% set up = states('${player}') not in ['unavailable', 'unknown'] %}
          {% set adb_ok = up and adb is not none and adb.state == 'Responding' %}
          {% set ms = adb.attributes.latency_ms if adb is not none else none %}
          {% if ping == 'off' %}<ha-alert alert-type="error" title="Offline">Not answering ping – TV unplugged, off Wi-Fi, or the VPN to it is down.</ha-alert>
          {% elif adb_ok %}<ha-alert alert-type="success" title="Online">Responding to ADB{{ ' in %d ms' % ms if ms is number else '' }}{{ ' · ping %d ms' % (rtt | float) if rtt | is_number else '' }}</ha-alert>
          {% elif ping == 'on' %}<ha-alert alert-type="warning" title="Reachable, but ADB isn't answering">Tap Check now. If it stays like this the TV may need a restart (or ADB debugging re-allowed on the TV).</ha-alert>
          {% else %}<ha-alert alert-type="info" title="Status unknown">Tap Check now.</ha-alert>{% endif %}
          {% set last_ok = adb.attributes.last_ok if adb is not none else none %}
          {% set frame = states('image.${tv}_screen') %}
          <small>Last ADB reply: {{ relative_time(as_datetime(last_ok)) ~ ' ago' if last_ok else 'never' }} · Last picture: {{ relative_time(as_datetime(frame)) ~ ' ago' if as_datetime(frame) else 'none yet' }} · Checked: {{ relative_time(as_datetime(adb.attributes.checked_at)) ~ ' ago' if adb is not none and adb.attributes.checked_at else 'never' }}</small>
        grid_options: {columns: full}
      - type: tile
        entity: binary_sensor.${tv}_ping
        name: Network (ping)
        grid_options: {columns: 6}
      - type: tile
        entity: sensor.${tv}_ping_latency
        name: Ping
        icon: mdi:timer-outline
        # Ping only creates this sensor while the TV answers, so hide it when offline
        visibility:
          - {condition: state, entity: binary_sensor.${tv}_ping, state: 'on'}
        grid_options: {columns: 6}
      - type: tile
        entity: sensor.${tv}_adb
        name: ADB
        state_content: [state, latency_ms]
        grid_options: {columns: 6}
      - type: tile
        entity: ${player}
        name: TV app
        state_content: [state, app_name]
        grid_options: {columns: 6}
      - type: tile
        entity: image.${tv}_screen
        name: Last picture
        icon: mdi:image-outline
        state_content: last_changed
        tap_action: {action: none}
        grid_options: {columns: 6}
      - type: tile
        entity: script.ggggtv_health_check
        name: Check now
        icon: mdi:refresh
        hide_state: true
        tap_action: {action: perform-action, perform_action: script.ggggtv_health_check, data: {tv: '${tv}'}}
        grid_options: {columns: 6}

  # ---- What the TV is showing ----
  - type: grid
    column_span: 2
    cards:
      - type: heading
        heading: Screen
        icon: mdi:monitor-eye
        badges:
          - type: entity
            entity: ${player}
            show_state: true
            show_icon: true
      # image.<tv>_screen changes on every frame, so the card reloads it (camera live view stalled)
      - type: picture-entity
        entity: image.${tv}_screen
        show_name: false
        show_state: false
        tap_action: {action: more-info}
        grid_options: {columns: full}
      - type: tile
        entity: input_boolean.${tv}_live
        name: Live view (stops after 10 min)
        grid_options: {columns: 6}
      - type: tile
        entity: script.ggggtv_screenshot
        name: Take one screenshot
        icon: mdi:camera
        hide_state: true
        tap_action: {action: perform-action, perform_action: script.ggggtv_screenshot, data: {tv: '${tv}'}}
        grid_options: {columns: 3}
      - type: tile
        entity: script.ggggtv_screen_info
        name: Read screen text
        icon: mdi:text-recognition
        hide_state: true
        tap_action: {action: perform-action, perform_action: script.ggggtv_screen_info, data: {tv: '${tv}'}}
        grid_options: {columns: 3}
      # What's playing + on-screen text: readable even when copy protection blanks the picture
      - type: markdown
        content: |-
          {% set s = 'sensor.${tv}_now_playing' %}
          **Now playing:** {{ states(s) }}
          **Highlighted:** {{ state_attr(s, 'focused') or '–' }}
          {% set text = state_attr(s, 'screen_text') or [] %}
          {% if text %}**On screen:** {{ text | join(' · ') }}{% endif %}
          {% set age = (now() - states[s].last_updated).total_seconds() if states[s] else 99999 %}
          {% if age > 120 %}<ha-alert alert-type="warning">Read {{ relative_time(states[s].last_updated) if states[s] else 'never' }} ago – turn on Live view or tap Read screen text to refresh.</ha-alert>
          {% else %}<small>Read {{ relative_time(states[s].last_updated) }} ago</small>{% endif %}
          <small>Paid video shows black (copy protection) but menus and guides drawn over it still show.</small>
        grid_options: {columns: full}

  # ---- Remote ----
  - type: grid
    cards:
      - type: heading
        heading: Remote
        icon: mdi:remote
      - !template
        file: firetv_remote.yaml
        vars: {tv: '${tv}'}

  # ---- Apps (each launch also turns live view on) ----
  - type: grid
    column_span: 3
    cards:
      - type: heading
        heading: Apps
        icon: mdi:apps
      - !template
        file: firetv_apps.yaml
        vars: {tv: '${tv}'}
